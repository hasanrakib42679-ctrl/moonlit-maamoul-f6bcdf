<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS ANAMUL V1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main class="wrap">
  <section class="card">
    <div class="rgb-border"></div>
    <img class="avatar" src="assets/anamul-v1.jpg" alt="AS ANAMUL V1">
    <h1>AS ANAMUL V1</h1>
    <div class="sub">LIVE KEY ACCESS • PREMIUM SYSTEM</div>
    <div class="server"><i></i> SERVER V1 ACTIVE</div>
    <p class="hint">Enter your active key to unlock access.</p>

    <div class="input-row">
      <input id="key" autocomplete="off" placeholder="Paste your key">
      <button id="paste">PASTE</button>
    </div>

    <button id="validate" class="primary">VALIDATE ACCESS</button>
    <button id="getKey" class="getkey">🔑 GET KEY</button>
    <button id="telegram" class="telegram">✈ JOIN TELEGRAM</button>

    <div id="access" class="access hidden">
      <div class="count-label">ACCESS EXPIRES IN</div>
      <div id="countdown">--:--:--</div>
      <div id="expiryText"></div>
    </div>

    <div id="msg" class="msg"></div>
    <footer>REMOTE VALIDATION • LIVE SERVER • AS_ KEY SYSTEM</footer>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
